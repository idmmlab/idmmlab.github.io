<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title description">
  <title id="title">A tunable coupling for torsional vibration reduction</title>
  <desc id="description">An input shaft drives an output shaft through a magnetorheological elastomer coupling. An applied magnetic field tunes the coupling stiffness to reduce the transmission of torsional vibration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1l9 5-9 5" fill="none" stroke="#547193" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#f4f7fb"/>
  <rect x="26" y="26" width="848" height="548" rx="26" fill="#fff" stroke="#d9e2ee" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="63" y="80" fill="#41648a" font-size="18" font-weight="700" letter-spacing="2">RESEARCH ILLUSTRATION</text>
    <text x="63" y="132" fill="#112d4c" font-size="48" font-weight="700">Tunable shaft coupling</text>
    <text x="65" y="165" fill="#4b607b" font-size="22">Magnetorheological elastomer for torsional vibration reduction</text>

    <g text-anchor="middle">
      <rect x="303" y="208" width="294" height="65" rx="15" fill="#eaf1fb" stroke="#c7d7e9" stroke-width="2"/>
      <text x="450" y="248" fill="#264872" font-size="26" font-weight="700">Magnetic field</text>
      <path d="M450 274v55" fill="none" stroke="#547193" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
      <text x="502" y="305" fill="#41648a" font-size="18" text-anchor="start">Tunes stiffness</text>

      <rect x="63" y="335" width="210" height="116" rx="16" fill="#f4f7fb" stroke="#ccdaeb" stroke-width="2"/>
      <text x="168" y="384" fill="#112d4c" font-size="32" font-weight="700">Input shaft</text>
      <text x="168" y="419" fill="#4b607b" font-size="19">Torsional vibration</text>

      <path d="M280 393h40" fill="none" stroke="#547193" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="329" y="335" width="242" height="116" rx="16" fill="#173d68"/>
      <text x="450" y="384" fill="#fff" font-size="31" font-weight="700">MRE coupling</text>
      <text x="450" y="419" fill="#dbe8f8" font-size="19">Adjustable stiffness</text>
      <path d="M580 393h40" fill="none" stroke="#547193" stroke-width="3" marker-end="url(#arrow)"/>

      <rect x="627" y="335" width="210" height="116" rx="16" fill="#f4f7fb" stroke="#ccdaeb" stroke-width="2"/>
      <text x="732" y="384" fill="#112d4c" font-size="32" font-weight="700">Output shaft</text>
      <text x="732" y="419" fill="#4b607b" font-size="19">Reduced vibration</text>
    </g>

    <path d="M63 500h774" fill="none" stroke="#d9e2ee" stroke-width="2"/>
    <text x="63" y="540" fill="#4b607b" font-size="18">Concept overview</text>
    <text x="837" y="540" fill="#4b607b" font-size="18" text-anchor="end">Lee, Park &amp; Kim (2019)</text>
  </g>
</svg>
